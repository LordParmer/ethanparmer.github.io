baseURL: https://ethanparmer.dev/
locale: en-us
title: Ethan Parmer
theme: PaperMod

enableRobotsTXT: true

pagination:
  pagerSize: 10

outputs:
  home: [HTML, RSS, JSON]

params:
  author: Ethan Parmer
  description: >
    Ethan Parmer, Lead Data Engineer. Databricks lakehouses for GxP-regulated
    healthcare, life sciences and finance.
  defaultTheme: dark

  # PNG icons and the link-preview card are generated at build time by
  # layouts/_partials/brand-images.html.
  assets:
    favicon: /favicon.svg
    favicon16x16: /favicon-16x16.png
    favicon32x32: /favicon-32x32.png
    apple_touch_icon: /apple-touch-icon.png
    safari_pinned_tab: /favicon.svg
  images: [og.jpg]

  # Contact links for the homepage and About page. Add an email to show a
  # mail button; it is left out until you choose one to publish.
  contact:
    email: ""
    linkedin: https://www.linkedin.com/in/ethan-parmer-mba-mha-chbap-a99718126/

  ShowReadingTime: true
  ShowToc: true
  TocOpen: false
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowRssButtonInSectionTermList: true
  ShowShareButtons: false

  # GoatCounter site code: https://ethanparmer.goatcounter.com
  goatcounter: ethanparmer

  # Turns on the homepage intro; its content comes from `hero` below.
  homeInfoParams:
    Title: Ethan Parmer

  # Homepage hero (layouts/_partials/home_info.html).
  hero:
    role: Lead Data Engineer
    kicker: Databricks · GxP · Life Sciences · Finance
    title: Engineering *trusted* data for regulated industries.
    lead: >
      I build **Databricks lakehouses** for healthcare, life sciences and
      finance, where every pipeline has to be correct, traceable and
      audit-ready. I go looking for the hardest problem in the room.
    # Portrait under assets/, rendered in greyscale and blended into the page.
    # Leave empty to show a generative study (assets/js/hero-art.js) instead.
    image: images/portrait.jpg
    meta:
      - label: Platform
        value: Databricks Lakehouse
      - label: Domains
        value: GxP · HCLS · Finance
      - label: Standard
        value: Validated by design
      # An entry can list `items` instead of a `value`; each item links to
      # its url when one is set (e.g. a Credly or Accredible badge).
      - label: Databricks certified
        items:
          - name: Data Engineer Associate
            url: https://credentials.databricks.com/7e143d93-24df-4276-bd68-521dfd63f1c9
          - name: Data Engineer Professional
            url: https://credentials.databricks.com/b8526e24-0e87-48e7-bc34-ff44e60a5bce
    focus:
      - title: Lakehouse engineering
        text: Medallion architectures, Delta Lake, Unity Catalog and Lakeflow pipelines that scale without surprises.
      - title: GxP & data integrity
        text: Validated, auditable pipelines built around ALCOA+ principles, end-to-end lineage and controlled change.
      - title: Healthcare & life sciences
        text: Clinical, quality and operational data shaped into something teams can trust and act on.
      - title: Finance
        text: Governed, reconciled data for reporting where every number has to tie out.

  socialIcons:
    - name: github
      url: https://github.com/LordParmer
    - name: linkedin
      url: https://www.linkedin.com/in/ethan-parmer-mba-mha-chbap-a99718126/
    - name: rss
      url: /index.xml

  fuseOpts:
    keys: [title, permalink, summary, content]

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 30
    - identifier: rss
      name: RSS
      url: /index.xml
      weight: 40
