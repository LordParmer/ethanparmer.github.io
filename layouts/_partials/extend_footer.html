{{- if and .IsHome (not site.Params.hero.image) }}
{{- with resources.Get "js/hero-art.js" | minify | fingerprint }}
<script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
{{- end }}
{{- end }}

{{- with site.Params.goatcounter }}
{{- if hugo.IsProduction }}
<script data-goatcounter="https://{{ . }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
{{- end }}
{{- end }}
